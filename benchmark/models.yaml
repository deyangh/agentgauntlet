# Models for the published leaderboard.
#
# Every model string is passed straight to LiteLLM, so credentials come from the
# usual provider environment variables (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...).
# Local Ollama models need no key and cost nothing; they are reached through the
# `ollama_chat/` provider, which supports tool calling (plain `ollama/` does not
# handle the tool-call loop correctly).
#
# Tool-calling support is a prerequisite, not a nicety: a model that cannot emit
# tool calls scores a meaningless 0% attack success rate with 0% utility. The
# utility column on the leaderboard is what exposes that.

repeats: 2
concurrency: 2
temperature: 0.0

models:
  - id: ollama_chat/llama3.1
    label: Llama 3.1 8B (local)
    notes: free, runs locally via Ollama

  - id: ollama_chat/qwen2.5
    label: Qwen 2.5 7B (local)
    notes: free, runs locally via Ollama

  - id: ollama_chat/mistral
    label: Mistral 7B (local)
    notes: free; weaker tool calling; watch the utility column

  # Uncomment the hosted models you want in the run. These cost real money.
